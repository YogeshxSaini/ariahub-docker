services:

  aria2:
    image: cypheroxus/ariahub:aria2
    build:
      context: ./aria2
    container_name: ariahub-aria2
    restart: unless-stopped

    environment:
      ARIA2_RPC_SECRET: "${ARIA2_RPC_SECRET}"
      ARIA2_MAX_CONCURRENT_DOWNLOADS: "${ARIA2_MAX_CONCURRENT_DOWNLOADS:-5}"
      ARIA2_SPLIT: "${ARIA2_SPLIT:-8}"
      ARIA2_MIN_SPLIT_SIZE: "${ARIA2_MIN_SPLIT_SIZE:-10M}"
      ARIA2_MAX_CONNECTION_PER_SERVER: "${ARIA2_MAX_CONNECTION_PER_SERVER:-8}"

    volumes:
      - "${DOWNLOAD_PATH:-./downloads}:/downloads"
      - "./aria2-data:/config"

    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 6800
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "${ARIA2_CPU_LIMIT:-2.0}"
          memory: "${ARIA2_MEM_LIMIT:-1G}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - ariahub


  backend:
    image: cypheroxus/ariahub:backend
    build:
      context: ./backend
    container_name: ariahub-backend
    restart: unless-stopped

    environment:
      ARIA2_RPC_URL: "http://aria2:6800/jsonrpc"
      ARIA2_RPC_SECRET: "${ARIA2_RPC_SECRET}"
      DATABASE_PATH: "/data/ariahub.db"
      API_KEY: "${API_KEY:-}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-}"

    depends_on:
      aria2:
        condition: service_healthy

    volumes:
      - "./backend-data:/data"

    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c
          "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-1.0}"
          memory: "${BACKEND_MEM_LIMIT:-512M}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - ariahub


  frontend:
    image: cypheroxus/ariahub:frontend
    build:
      context: ./frontend
    container_name: ariahub-frontend
    restart: unless-stopped

    environment:
      # Injected into nginx's proxy config at container start (via
      # nginx.conf.template + envsubst), not baked into the frontend
      # build. Changing this only needs a container restart, not a
      # rebuild.
      API_KEY: "${API_KEY:-}"

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_PORT:-8088}:80"

    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU_LIMIT:-0.5}"
          memory: "${FRONTEND_MEM_LIMIT:-256M}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - ariahub


networks:
  ariahub:
    driver: bridge
